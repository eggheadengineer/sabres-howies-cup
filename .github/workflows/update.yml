name: Refresh standings

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["build.py", "template.html", ".github/workflows/update.yml"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild page from live scores
        run: python3 build.py
      - name: Commit if changed
        run: |
          git config user.name "sabres-bot"
          git config user.email "sabres-bot@users.noreply.github.com"
          git add index.html data/snapshot.json
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "Refresh standings $(date -u +'%Y-%m-%d %H:%MZ')"
            git push
          fi
      - name: Stage site
        run: |
          mkdir -p _site
          cp index.html _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
